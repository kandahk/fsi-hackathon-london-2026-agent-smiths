[project]
name = "agentsmith"
version = "0.1.0"
description = "AgentSmith: multi-bank collective fraud intelligence agent"
requires-python = ">=3.11"
dependencies = [
    "langgraph>=1.0,<2",
    "langchain>=1.0,<2",
    "langchain-openai>=1.0,<2",
    "python-dotenv>=1.0,<2",
    "langgraph-cli[inmem]>=0.4,<1",
    "deepagents>=0.7,<1",
    "pydantic>=2,<3",
    "langsmith>=0.4,<1",
]

# Declared explicitly: with several top-level folders (data/, evals/, modules/) setuptools' flat-layout
# auto-discovery refuses to guess, which breaks the LangSmith deployment build.
[tool.setuptools]
packages = ["utils", "tools"]
py-modules = ["agent", "sub_agents"]
